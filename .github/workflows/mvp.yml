name: MVP and glTF PBR acceptance
# A push checks every branch; a pull request's branch is pushed here, so
# pull_request would check the same commit again.
on:
  push:
  workflow_dispatch:
concurrency:
  group: mvp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mvp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      # Dependencies of the host, wasm32 and --dev gallery builds ( scripts/check-mvp ).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> target/gallery-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install software Vulkan and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Evaluate MVP and glTF PBR
        run: ./scripts/check-gltf-pbr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-comparison-evidence
          path: test-results/

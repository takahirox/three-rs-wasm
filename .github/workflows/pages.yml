name: Examples gallery
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gallery's Wasm ( scripts/build-gallery: every example linked once, then
  # split into the primary module and the parts ), three-tsl's and the site.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      # The check runs in Playwright's image of the version the lockfile pins.
      playwright: ${{ steps.versions.outputs.playwright }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # The gallery's dependencies, built with scripts/build-gallery's flags into
      # its target directory; the workspace's own crates always rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/gallery
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Binaryen
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_127/binaryen-version_127-x86_64-linux.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_127/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - id: versions
        run: |
          echo "rustc=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "playwright=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      # three-tsl's Wasm takes minutes to build and changes only with tsl/.
      - uses: actions/cache@v4
        id: tsl
        with:
          path: web/build/tsl
          key: tsl-web-${{ steps.versions.outputs.rustc }}-${{ hashFiles('tsl/**') }}
      - name: Build the site
        run: |
          # The split's glue and the example pages run on Node.js ( acorn ).
          npm ci --ignore-scripts
          scripts/build-gallery
          if [ "${{ steps.tsl.outputs.cache-hit }}" != true ]; then
            ( cd tsl && wasm-pack build --target web --profile web --out-dir ../web/build/tsl --no-typescript )
          fi
          python3 tools/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/pages/three-rs-wasm

  # The published-gallery check opens every ported example on a software GPU
  # ( SwiftShader ), so it runs in shards against the uploaded site, balanced by
  # the examples' recorded durations ( tests/pages/gallery.spec.js ). Playwright's
  # image carries the browser and its system packages.
  check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright }}-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .cache/pages-artifact
      - name: Unpack the site
        run: |
          mkdir -p .cache/pages/three-rs-wasm
          tar -xf .cache/pages-artifact/artifact.tar -C .cache/pages/three-rs-wasm
      - name: Check published layout and examples
        env:
          GALLERY_SHARD: ${{ matrix.shard }}/6
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
        run: |
          npm ci --ignore-scripts
          npx playwright test --config playwright.pages.config.js --reporter=dot,json
      # Each example's duration, for rebalancing the shards ( tools/ci/gallery_durations.py ).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-report-${{ matrix.shard }}
          path: test-results/report.json

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, check]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

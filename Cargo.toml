[package]
name = "three-rs-wasm"
version = "0.1.0"
edition = "2024"
description = "Rust-first WebGPU 3D library with Three.js r186 behavioral compatibility"
license = "MIT"
repository = "https://github.com/takahirox/three-rs-wasm"
rust-version = "1.94"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
glam = { version = "0.30.9", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["serde", "bytemuck"] }
wgpu = { version = "26.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "webgpu", "wgsl", "counters"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "hdr"] }
web-time = "1"
uuid = { version = "1", features = ["v4", "js", "serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "EventTarget", "Event", "PointerEvent", "KeyboardEvent", "Response", "Performance", "console", "Blob", "ImageBitmap", "ImageBitmapOptions", "ColorSpaceConversion", "PremultiplyAlpha", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "ImageData"] }

[dev-dependencies]
pollster = "0.4"

[profile.release]
lto = true
codegen-units = 1

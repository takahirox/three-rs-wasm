[package]
name = "three-rs-wasm"
version = "0.1.0"
edition = "2024"
description = "Rust-first WebGPU 3D library with Three.js r186 behavioral compatibility"
license = "MIT"
repository = "https://github.com/takahirox/three-rs-wasm"
rust-version = "1.94"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extensions", "KHR_materials_unlit", "KHR_materials_emissive_strength", "KHR_materials_ior", "KHR_materials_specular", "KHR_texture_transform"] }
draco-core = { version = "2.1.0", default-features = false, features = ["decoder", "encoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
optimesh = "1.1.0"
mikktspace = "0.3.0"
miniz_oxide = "0.8.9"
ruzstd = { version = "0.7.3", default-features = false, features = ["std"] }
basisu = "0.1.0"
glam = { version = "0.30.9", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
libm = "0.2"
half = { version = "2", features = ["serde", "bytemuck"] }
wgpu = { version = "26.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "webgpu", "wgsl", "counters"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "hdr", "webp"] }
web-time = "1"
uuid = { version = "1", features = ["v4", "js", "serde"] }
# The engine of rapier.js 0.17.3 ( @dimforge/rapier3d-compat ), which RapierPhysics.js loads.
rapier3d = { version = "=0.26.1", default-features = false, features = ["dim3", "f32", "debug-render"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "EventTarget", "Event", "PointerEvent", "KeyboardEvent", "Response", "Performance", "console", "Blob", "ImageBitmap", "ImageBitmapOptions", "ColorSpaceConversion", "PremultiplyAlpha", "CanvasGradient", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "CanvasRenderingContext2d", "ImageData", "HtmlMediaElement", "HtmlVideoElement", "HtmlImageElement", "TextMetrics", "HtmlElement", "DomRect", "WebGl2RenderingContext", "CssStyleDeclaration", "Node", "SvgElement", "DomParser", "SupportedType"] }

[dev-dependencies]
pollster = "0.4"

[profile.release]
lto = true
codegen-units = 1

# wgpu 26.0.1 omits WebGPU color-attachment depthSlice (see vendor/wgpu/PATCH.md).
[patch.crates-io]
wgpu = { path = "vendor/wgpu" }

<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style><script type="importmap">{"imports":{"three":"/.cache/three-r186/src/Three.WebGPU.js"}}</script></head><body><canvas width="256" height="256"></canvas><script type="module">
// Pinned webgpu_pmrem_equirectangular scene, with fixed viewport and no UI.
import * as T from 'three';
import {UltraHDRLoader} from '/.cache/three-r186/examples/jsm/loaders/UltraHDRLoader.js';
const {normalWorldGeometry,uniform,pmremTexture}=T.TSL;

</script></body></html>

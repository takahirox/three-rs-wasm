</script></head><body><script type="module">
import * as THREE from 'three';
const id=new URLSearchParams(location.search).get('id');if(!['webgpu_clearcoat','misc_controls_fly','webgpu_shadowmap_pointlight','webgpu_lightprobe','webgpu_tonemapping'].includes(id))throw Error('invalid fixture');

const html=await(await fetch(`/.cache/three-r186/examples/${id}.html`)).text();for(const node of new DOMParser().parseFromString(html,'text/html').querySelectorAll('script[id],#container,#info,#blocker,video'))document.body.appendChild(document.importNode(node,true));

source=`class GUI{constructor(){fixtureControls.length=0;}add(o,k){const item={onChange(fn){this.callback=fn;return this;},name(){return this;},step(){return this;},options(){return this;},onFinishChange(fn){this.callback=fn;return this;},min(){return this;},max(){return this;},setValue(v){if(typeof o[k]==='function'){o[k]();return;}o[k]=v;this.callback?.(v);},listen(){return this;}};fixtureControls.push(item);return item;}addColor(o,k){const item={onChange(fn){this.callback=fn;return this;},listen(){return this;},setValue(v){if(typeof o[k]==='number'){o[k]=v;this.callback?.(v);return;}const c=o[k];c.r=((v>>16)&255)/255;c.g=((v>>8)&255)/255;c.b=(v&255)/255;this.callback?.(c);}};fixtureControls.push(item);return item;}open(){}destroy(){}addFolder(){const folder=Object.create(this);folder.$children=document.createElement('div');return folder;}}`+'\n'+source;

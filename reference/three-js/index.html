<!doctype html><html lang="en"><meta charset="utf-8"><title>Three.js r186 migration reference</title>
<style>body{margin:0;background:#102030}canvas{display:block;width:512px;height:512px}</style>
<canvas width="512" height="512"></canvas>
<script type="module">
import * as T from '/.cache/three-r186/src/Three.WebGPU.js';
const canvas=document.querySelector('canvas');
try {
  const example=Number(new URLSearchParams(location.search).get('example')||0);
  const renderer=new T.WebGPURenderer({canvas,antialias:false});await renderer.init();renderer.setSize(512,512,false);
  const scene=new T.Scene();scene.background=new T.Color(0x102030);
  const camera=example===1?new T.OrthographicCamera(-3,3,3,-3,.1,2000):new T.PerspectiveCamera(50,1,.1,2000);camera.position.z=5;
  const cube=new T.Mesh(new T.BoxGeometry(1.5,1.5,1.5),new T.MeshBasicMaterial({color:0xee6633}));scene.add(cube);
  if(example===1) {
    cube.position.x=-1.1;
    const group=new T.Group();group.position.set(.8,.6,0);scene.add(group);
    const texture=await new T.TextureLoader().loadAsync('/web/checker.png');texture.colorSpace=T.SRGBColorSpace;texture.minFilter=T.LinearFilter;texture.generateMipmaps=false;
    group.add(new T.Mesh(new T.SphereGeometry(.75,24,16),new T.MeshStandardMaterial({map:texture,roughness:.7})));
    scene.add(new T.AmbientLight(0xffffff,.3));
    const directional=new T.DirectionalLight(0xffffff,2);directional.position.set(2,3,4);scene.add(directional);
    const point=new T.PointLight(0xff8040,10,0,2);point.position.set(-2,1,2);scene.add(point);
    const geometry=new T.BufferGeometry().setFromPoints([new T.Vector3(-2,-1.5,0),new T.Vector3(0,-.9,0),new T.Vector3(2,-1.5,0)]);
    scene.add(new T.Line(geometry,new T.LineBasicMaterial({color:0x44ff88})));
    const points=new T.Points(geometry,new T.PointsMaterial({color:0xffffff,size:1,sizeAttenuation:false}));points.position.y=-.4;scene.add(points);
  }
  renderer.render(scene,camera);canvas.setAttribute('data-ready','true');window.renderer=renderer;
} catch(error) {canvas.setAttribute('data-error',String(error));}
</script></html>

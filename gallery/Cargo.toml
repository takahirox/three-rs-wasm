[package]
name = "three-rs-gallery"
version = "0.1.0"
edition = "2024"
description = "The examples gallery: Rust ports of Three.js r186 examples, built on three-rs-wasm"
license = "MIT"
publish = false
rust-version = "1.94"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Each example module is a feature, with the modules it uses; `example_<module>`
# also dispatches the module's examples, so a module another one only borrows
# code from compiles without its examples. The published gallery builds every
# feature once and splits it per module ( scripts/build-gallery ).
default = ["all"]
# KTX2 / Basis Universal transcoding, for the modules whose examples load
# KTX2 textures or glTF with KHR_texture_basisu.
basisu = ["three-rs-wasm/basisu", "dep:basisu"]

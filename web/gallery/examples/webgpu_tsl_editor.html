<script type="importmap">{"imports":{"three/tsl":"./tsl-module.js","three":"./ui/three/shim.js","three/webgpu":"./ui/three/shim.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<script type="module">
import './upstream.js';
import {installElements} from './elements.js';
import {installOrbit} from './orbit.js';
import {explain, text} from './diagnostic.js';
// The gallery's Wasm: the primary module and the example module's parts.
import {loadRuntime} from './runtime.js?v=split-1';
const canvas = document.querySelector('canvas');
const loading = document.querySelector('#loading');
let app;
let closing = false;
let pending = 0;
const release = () => { if (closing && pending === 0) {app?.free(); app = null;} };
window.addEventListener('pagehide', () => { closing = true; release(); });
 try {
  // The transpiler page renders nothing: it needs no WebGPU.
  if (!navigator.gpu) throw new Error('WebGPU対応ブラウザが必要です。');
  {
   // webgpu_tsl_editor runs on the three-tsl crate's own Wasm ( web/tsl-pkg ), not this app.
   const {startTslEditor} = await import('./tsl-editor.js?v=tsl-2');
   await startTslEditor(loading);
  }
} catch (error) { app?.free(); app = null; explain('webgpu_tsl_editor', String(error), 'error'); }
</script></body></html>

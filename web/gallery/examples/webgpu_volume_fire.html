<html lang="ja"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>three-rs-wasm - webgpu - volume - fire</title><link rel="stylesheet" href="../files/main.css">
<style>

<script>window.galleryUi=!navigator.webdriver||new URLSearchParams(location.search).has("ui");</script><script src="ui/gpu-memory.js"></script>
<script type="importmap">{"imports":{"three/tsl":"./ui/three/shim.js","three":"./ui/three/shim.js","three/webgpu":"./ui/three/shim.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<script type="module">
import './upstream.js';
import {installElements} from './elements.js';
import {installOrbit} from './orbit.js';
import {explain, text} from './diagnostic.js';
// The gallery's Wasm: the primary module and the example module's parts.
import {loadRuntime} from './runtime.js?v=split-1';
const canvas = document.querySelector('canvas');
const loading = document.querySelector('#loading');
let app;
let closing = false;
let pending = 0;
const release = () => { if (closing && pending === 0) {app?.free(); app = null;} };
window.addEventListener('pagehide', () => { closing = true; release(); });
 try {
  // The transpiler page renders nothing: it needs no WebGPU.
  if (!navigator.gpu) throw new Error('WebGPU対応ブラウザが必要です。');
  {
  // Keep the glue and Wasm on the same cache revision when the runtime API changes.
  const runtimeRevision = 'page-1';
  const runtime = await loadRuntime('volume_fire', runtimeRevision);
    {
  const resize = () => {    canvas.width = Math.max(1, Math.round(innerWidth * ((1)))); canvas.height = Math.max(1, Math.round(innerHeight * ((1)))); app?.request_render(); };
  window.galleryResize=resize;
  resize(); canvas.hidden = false; 
  // The example's own program ( its Rust function, named after it ).
  app = await runtime.webgpu_volume_fire(canvas, !new URLSearchParams(location.search).has('still'));
  if (closing) { app.free(); app = null; } else {
   window.app = app;
   loading.hidden = true;
   document.body.dataset.status = 'running';
   document.body.dataset.backend = 'rust-wasm-webgpu';
   addEventListener('resize', resize);
   // A CSS renderer's element over the canvas receives the pointer, as the page's controls do.
   const pointerTarget=document.querySelector('[data-pointer-target]')??canvas;
   installOrbit(pointerTarget,app,{touchRotate:true});
   // webgpu_postprocessing_ssgi_ballpool: the canvas's pointer events, in the window's
   // normalized coordinates, with each press's pointer id and whether it is a touch.
   const settings = document.querySelector('#settings');
   {
    const controls=[["Simulate Fluid",true],["Simulation Speed",0,2,1.2,0.01],["Render Resolution",0.1,1,0.5,0.01],["Raymarch Steps",4,42,16,1],["Denoise Enabled",true],["Denoise Strength",0,1,0.5,0.01],["Bloom Enabled",true],["Bloom Strength",0,3,0.1,0.01],["Bloom Radius",0,1,1,0.01],["Bloom Threshold",0,1,0.5,0.01],["Glow Spread",1,5,5,0.1],["Fire Hue Shift",0,360,0,1],["Saturation",0,2,1.1,0.05],["Fire Start Color","#ffe68c"],["Fire Mid Color","#ff7305"],["Fire End Color","#ff0000"],["Temperature Rate",0,8,5.5,0.01],["Density Rate",0,20,7,0.01],["Movement Boost",0,0.4,0.25,0.01],["Movement Wind Strength",0,50,6.5,0.01],["Teapot Emissive",0,1,0.2,0.001],["Phase Asymmetry (g)",-0.99,0.99,0,0.01],["Powder Effect",0,1,0.59,0.01],["Multi Scattering",0,1,1,0.01],["Shadow Absorption",0,10,2,0.01],["Shadow Ambient",0,1,0.5,0.01],["Buoyancy (Rise)",0,10,3,0.01],["Velocity Damping",0,2,0.25,0.01],["Fire Lifespan",0.5,10,1.3,0.1],["Smoke Lifespan",1,100,3.5,0.5],["Turbulence Strength",0,5,3.2,0.01],["Turbulence Decay",0,1,0.1,0.01],["Turbulence Frequency",1,10,10,0.01],["Key Light Intensity",0,1500,1000,1],["Light Smoke",0,2,2,0.001],["Light Near Scale",0,20,10,0.05],["Light Far Scale",0,20,15,0.05],["Light Reflection",0,20,10,0.001],["Proj Light Radius",1,30,20,0.1],["Proj Light Freq",0.1,1,0.2,0.01],["Proj Noise Fade Dist",1,30,17,0.1],["Proj Center Fade",0.1,5,3.25,0.05]];
    settings.hidden=!controls.length;window.galleryControls=controls;
    controls.forEach(([name,min,max,value,step],i)=>{if(min===null){const button=text('button',name,settings);button.id='particle-'+i;button.addEventListener('click',()=>{app.tsl_parameter(i,1);
     // GPU readbacks (the PMREM exports) finish a few frames later.
     const save=tries=>{const file=app.gallery_take_export?.();if(file){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([file[1]]));link.download=file[0];link.click();}else if(tries>0)requestAnimationFrame(()=>save(tries-1));};save(120);});return;}const label=text('label',name+' ',settings),input=document.createElement(Array.isArray(min)?'select':'input');input.id='particle-'+i;
     if(Array.isArray(min)){min.forEach((name,index)=>input.add(new Option(name,index)));input.value=max;}else{
     input.type=typeof min==='boolean'?'checkbox':typeof min==='string'?'color':'range';if(input.type==='checkbox')input.checked=min;else if(input.type==='color')input.value=min;else Object.assign(input,{min,max,step,value});
     }label.append(input);input.addEventListener('input',()=>app.tsl_parameter(i,input.type==='checkbox'?Number(input.checked):input.type==='color'?parseInt(input.value.slice(1),16):Number(input.value)));
    });
   }
   {
    // Absolute CSS-pixel pointer events for controls that read positions, not deltas.
    const target=pointerTarget;target.style.touchAction='none';target.addEventListener('contextmenu',event=>event.preventDefault());
    target.addEventListener('pointerdown',event=>{if(event.isPrimary===false)return;target.setPointerCapture(event.pointerId);app.gallery_draw(10+event.button,event.clientX,event.clientY);});
    target.addEventListener('pointermove',event=>{if(event.isPrimary===false)return;app.gallery_draw(0,event.clientX,event.clientY);});
    target.addEventListener('pointerup',event=>{if(event.isPrimary===false)return;app.gallery_draw(20+event.button,event.clientX,event.clientY);});
   }
   // ArcballControls' wheel: deltaY, and deltaX for the shift field of view.
   // The original's stats.js, lil-gui panels and Inspector ( web/gallery/ui/ ). Automated
   // rendering comparisons capture the canvas without them; ?ui=1 shows them there too
   // ( tests/browser/gallery-ui.spec.js ).
   if (window.galleryUi) {
    const {installUi} = await import(`./ui/ui.js?v=${runtimeRevision}`);
    await installUi('webgpu_volume_fire', app, settings).catch(e => {console.warn('gallery UI', e);document.body.dataset.uiError = String(e);document.body.dataset.ui = 'ready';});
   }
   new MutationObserver(() => { if (canvas.dataset.error && !closing) {closing = true; release(); settings.hidden = true; explain('webgpu_volume_fire', canvas.dataset.error, 'error');} }).observe(canvas, {attributes:true, attributeFilter:['data-error']});
  }
  }
   }
} catch (error) { app?.free(); app = null; explain('webgpu_volume_fire', String(error), 'error'); }
</script></body></html>

<script type="module">
import './upstream.js';
import {installElements} from './elements.js';

// The gallery's Wasm: the primary module and the example module's parts.

const canvas = document.querySelector('canvas');
const loading = document.querySelector('#loading');
let app;
let closing = false;
let pending = 0;
const release = () => { if (closing && pending === 0) {app?.free(); app = null;} };
window.addEventListener('pagehide', () => { closing = true; release(); });
 try {
  // The transpiler page renders nothing: it needs no WebGPU.
  if (!navigator.gpu) throw new Error('WebGPU対応ブラウザが必要です。');
  {
  // Keep the glue and Wasm on the same cache revision when the runtime API changes.
  const runtimeRevision = 'page-1';
  const runtime = await loadRuntime('log_depth', runtimeRevision);
    {
  const resize = () => {    canvas.width = Math.max(1, Math.round(innerWidth * (((devicePixelRatio))))); canvas.height = Math.max(1, Math.round(innerHeight * (((devicePixelRatio))))); app?.request_render(); };
  window.galleryResize=resize;
  resize(); canvas.hidden = false; 
  {
   // The original's two renderer containers with their labels and the draggable
   // border; the Rust scene draws both views into the canvas below.
   const style=document.createElement('style');style.textContent=':where(#container,#container *){all:revert}#container{display:flex;position:absolute;left:0;top:0;width:100%;pointer-events:none;font:initial;-webkit-font-smoothing:auto;-moz-osx-font-smoothing:auto}#container>div{display:inline-block;position:relative}#container canvas{position:relative}#container h2.renderer_label{position:absolute;bottom:1em;width:100%;color:white;z-index:10;display:block;text-align:center;margin:revert;padding:revert;font-size:revert;line-height:revert;font-weight:revert}#container #renderer_border{position:absolute;top:0;left:25%;bottom:0;width:2px;z-index:10;opacity:.8;background:#ccc;border:1px inset #ccc;cursor:col-resize;pointer-events:auto;display:block}body{touch-action:none}';
   document.head.append(style);document.documentElement.lang='en';
   const container=document.createElement('div');container.id='container';const boxes=[];
   for(const [id,label] of [['normal','normal z-buffer'],['logzbuf','logarithmic z-buffer']]){const div=document.createElement('div');div.id=`container_${id}`;const h2=document.createElement('h2');h2.className='renderer_label';h2.textContent=label;const box=document.createElement('canvas');box.width=box.height=0;div.append(h2,box);boxes.push([div,box]);container.append(div);}
   const border=document.createElement('div');border.id='renderer_border';container.append(border);
   let split=.25;const size=()=>{boxes.forEach(([div,box],i)=>{const f=i?1-split:split;div.style.width=`${f*100}%`;box.style.width=`${f*innerWidth}px`;box.style.height=`${innerHeight}px`;});border.style.left=`${split*100}%`;};
   size();addEventListener('resize',size);document.body.append(container);
   addEventListener('mousemove',e=>app?.gallery_draw(3,e.clientX/innerWidth,e.clientY/innerHeight));
   addEventListener('wheel',e=>app?.gallery_draw(2,e.deltaY,0));
   border.addEventListener('pointerdown',()=>{const move=e=>{split=Math.max(0,Math.min(1,e.clientX/innerWidth));app?.gallery_draw(4,split,0);size();};const up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);};addEventListener('pointermove',move);addEventListener('pointerup',up);});
  }

  app = await runtime.webgpu_camera_logarithmicdepthbuffer(canvas, !new URLSearchParams(location.search).has('still'));

   addEventListener('resize', resize);

   const pointerTarget=document.querySelector('[data-pointer-target]')??canvas;
   // webgpu_postprocessing_ssgi_ballpool: the canvas's pointer events, in the window's

   const settings = document.querySelector('#settings');
   {
    const controls=[];
    settings.hidden=!controls.length;window.galleryControls=controls;
    controls.forEach(([name,min,max,value,step],i)=>{if(min===null){const button=text('button',name,settings);button.id='particle-'+i;button.addEventListener('click',()=>{app.tsl_parameter(i,1);
     // GPU readbacks (the PMREM exports) finish a few frames later.
     const save=tries=>{const file=app.gallery_take_export?.();if(file){const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([file[1]]));link.download=file[0];link.click();}else if(tries>0)requestAnimationFrame(()=>save(tries-1));};save(120);});return;}const label=text('label',name+' ',settings),input=document.createElement(Array.isArray(min)?'select':'input');input.id='particle-'+i;
     if(Array.isArray(min)){min.forEach((name,index)=>input.add(new Option(name,index)));input.value=max;}else{
     input.type=typeof min==='boolean'?'checkbox':typeof min==='string'?'color':'range';if(input.type==='checkbox')input.checked=min;else if(input.type==='color')input.value=min;else Object.assign(input,{min,max,step,value});
     }label.append(input);input.addEventListener('input',()=>app.tsl_parameter(i,input.type==='checkbox'?Number(input.checked):input.type==='color'?parseInt(input.value.slice(1),16):Number(input.value)));
    });
   }
   // ArcballControls' wheel: deltaY, and deltaX for the shift field of view.

   if (window.galleryUi) {
    const {installUi} = await import(`./ui/ui.js?v=${runtimeRevision}`);

   }

  }
  }
   }
} catch (error) { app?.free(); app = null; explain('webgpu_camera_logarithmicdepthbuffer', String(error), 'error'); }

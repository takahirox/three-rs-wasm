<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>three-rs-wasm — Interactive demo</title>
<style>
:root{color-scheme:dark;font:16px/28px system-ui,sans-serif;background:#09131f;color:#e6edf5}
*{box-sizing:border-box}body{margin:0}main{max-width:1060px;margin:auto;padding:48px 24px}
.eyebrow{color:#71d9bd;font-size:12px;letter-spacing:.18em}h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.04em;line-height:56px;margin:8px 0}
.intro,.hint{color:#a6b7ca}nav{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 20px}
a,button{color:inherit;font:inherit;text-decoration:none;border:1px solid #334557;border-radius:10px;padding:9px 15px;background:#132333;cursor:pointer}
a:hover,button:hover{border-color:#71d9bd}a[aria-current="page"]{background:#173e39;border-color:#71d9bd}
a:focus-visible,button:focus-visible{outline:2px solid #71d9bd;outline-offset:4px}button:disabled{opacity:.45;cursor:wait}
.demo{display:grid;grid-template-columns:minmax(0,512px) minmax(220px,1fr);gap:32px;align-items:start}
.stage{border-radius:16px;overflow:hidden;background:#102030}canvas{display:block;width:100%;height:auto;aspect-ratio:1;touch-action:manipulation}
h2{margin:0 0 12px;font-size:22px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}
#status{color:#71d9bd;overflow-wrap:anywhere}#status.error{color:#ffaaa3}
.detail{border-top:1px solid #263747;margin-top:24px;padding-top:20px;color:#a6b7ca;font-size:14px}
@media(max-width:760px){main{padding:28px 16px}.demo{grid-template-columns:minmax(0,512px)}}
.sculpture main{max-width:1320px}.sculpture .demo{grid-template-columns:minmax(0,720px) minmax(260px,1fr)}
.sculpture canvas{touch-action:none;cursor:grab}.sculpture canvas:active{cursor:grabbing}
label{display:block;margin:20px 0}input[type=range]{display:block;width:100%;accent-color:#71d9bd}output{float:right;color:#71d9bd}
@media(max-width:900px){.sculpture .demo{grid-template-columns:minmax(0,720px)}}
</style>
<main>
<div class="eyebrow">INTERACTIVE DEMO</div>
<h1>three-rs-wasm</h1>
<p class="intro">回転する立方体から、光とテクスチャのあるシーンまで。</p>
<nav aria-label="デモを選択">
<a href="?example=0" data-example="0">01 · 回転と選択</a>
<a href="?example=1" data-example="1">02 · 光とテクスチャ</a>
<a href="?example=2" data-example="2">03 · 公式の木箱</a>
<a href="?example=3" data-example="3">04 · 彫刻と動く光</a>
<a href="?example=4" data-example="4">05 · glTF Helmet</a>
<a href="?example=5" data-example="5">06 · GLB BoomBox</a>
</nav>
<div class="demo">
<div class="stage"><canvas id="scene" width="512" height="512" aria-label="クリックしてオブジェクトを選択できる3Dデモ"></canvas></div>
<section>
<h2 id="title">回転と選択</h2>
<p id="description">透視投影のカメラで、回転する立方体を表示します。</p>
<p class="hint">オレンジ色の立方体をクリックすると選択して停止します。背景をクリックすると回転を再開します。</p>
<div class="controls"><button id="rebuild" disabled>形状を入れ替える</button><a id="reset" href="?example=0">リセット</a></div>
<div id="sculpture-controls" hidden>
<button id="pause" type="button" aria-pressed="false">一時停止</button>
<label for="deformation">変形の強さ <output id="deformation-value">1.0</output><input id="deformation" type="range" min="0" max="3" step="0.1" value="1"></label>
<label for="speed">光の速度 <output id="speed-value">1.0</output><input id="speed" type="range" min="0" max="2" step="0.1" value="1"></label>
</div>
<p id="status" role="status">デモを読み込んでいます…</p>
<p class="detail">「形状を入れ替える」で立方体を色分けした平面に置き換えます。繰り返すと三角形と四角形が切り替わります。</p>
</section>
</div>
</main>
<script type="module">
const canvas=document.querySelector('canvas');
const status=document.querySelector('#status');
const rebuild=document.querySelector('#rebuild');
const params=new URLSearchParams(location.search);
const requested=Number(params.get('example'));
const example=[0,1,2,3,4,5].includes(requested)?requested:0;
const staticMode=params.has('static');
document.querySelector('#reset').href=`?example=${example}${staticMode?'&static=1':''}`;
document.querySelector(`[data-example="${example}"]`).setAttribute('aria-current','page');
if(example===1){
  document.querySelector('#title').textContent='光とテクスチャ';
  document.querySelector('#description').textContent='平行投影のカメラで、テクスチャ付きの球、立方体、線と点を表示します。環境光・平行光源・点光源を組み合わせています。';
}
if(example===2){
  document.querySelector('#title').textContent='公式example · Geometry / Cube';
  document.querySelector('#description').textContent='Three.js公式の木箱デモをRustに移植。公式r186のテクスチャ、視野角70°のカメラ、X・Y軸の回転を再現しています。';
  document.querySelector('.hint').textContent='木箱をクリックすると停止します。背景をクリックすると回転を再開します。';
  document.querySelector('.detail').innerHTML='元のWebGL描画をWebGPUへ移植しています。このデモでは512×512、アンチエイリアス・ミップマップなしで表示します。<br><br><a href="https://threejs.org/examples/#webgl_geometry_cube" target="_blank" rel="noreferrer">公式example ↗</a>';
  rebuild.hidden=true;
}
if(example===3){
  document.body.classList.add('sculpture');
  canvas.width=720;canvas.height=720;
  canvas.setAttribute('aria-label','ドラッグで回転、ホイールで拡大できる頭部彫刻と動く光');
  document.querySelector('#title').textContent='Point Lights · 光でほどける彫刻';
  document.querySelector('#description').textContent='16,160枚の三角形から64,640面の立体的な破片を生成。赤と青の光が近づくと、顔の表面が浮き上がります。';
  document.querySelector('.hint').textContent='ドラッグで視点を回転、ホイールで拡大・縮小。変形の強さを0にすると元の彫刻に戻ります。';
  document.querySelector('.detail').innerHTML='Three.js公式 WebGPU / Point Lights のモデルと変形を移植。材質はPhongからStandardへ、変形処理はTSLからRustへ変更しています。720×720・アンチエイリアスなしで表示します。<br>モデル: David OReilly · 変形: oosmoxiecode<br><br><a href="https://threejs.org/examples/webgpu_lights_pointlights.html" target="_blank" rel="noreferrer">公式example ↗</a>';
  rebuild.hidden=true;
  document.querySelector('#sculpture-controls').hidden=false;
  status.textContent='3Dモデルを読み込んでいます…';
}
function showGltfModel(model){
  document.querySelector('#title').textContent=model===4?'glTF · Damaged Helmet':'GLB · BoomBox';
  document.querySelector('#description').textContent=model===4?'公式glTF Loaderのヘルメットモデル。glTF・外部バッファー・JPEGをRustで読み込んで表示します。':'モデルと画像を1ファイルにまとめたGLBをRustで読み込んで表示します。';
  canvas.setAttribute('aria-label',model===4?'Damaged Helmet · ドラッグで回転、ホイールで拡大':'BoomBox · ドラッグで回転、ホイールで拡大');
  document.querySelector('#reset').href=`?example=${model}`;
}
if(example===4||example===5){
  document.body.classList.add('sculpture');canvas.width=720;canvas.height=720;
  showGltfModel(example);
  document.querySelector('.hint').textContent='ドラッグで視点を回転、ホイールで拡大・縮小できます。';
  document.querySelector('.detail').innerHTML='HDR環境反射、金属・粗さ・法線・発光マップをRust / WebGPUで描画します。<br><br><a href="https://threejs.org/examples/webgpu_loader_gltf.html" target="_blank" rel="noreferrer">公式 glTF Loader ↗</a>';
  const controls=document.createElement('div');controls.id='gltf-controls';controls.innerHTML=`
  <label>モデル <select id="gltf-model"><option value="4">Damaged Helmet</option><option value="5">BoomBox</option></select></label>
  <label>露出 <input id="gltf-exposure" type="range" min="0.1" max="3" step="0.05" value="1"></label>
  <label>環境光 <input id="gltf-intensity" type="range" min="0" max="3" step="0.05" value="1"></label>
  <label>環境の回転 <input id="gltf-rotation" type="range" min="-3.14159" max="3.14159" step="0.01" value="0"></label>
  <label>背景のぼかし <input id="gltf-blur" type="range" min="0" max="1" step="0.01" value="0"></label>
  <label><input id="gltf-background" type="checkbox" checked> HDR背景を表示</label>
  <label>環境画像 <select id="gltf-environment"><option value="royal">Royal Esplanade</option><option value="none">環境光なし</option></select></label>`;
  document.querySelector('.detail').before(controls);document.querySelector('#gltf-model').value=String(example);
  rebuild.hidden=true;status.textContent='glTFモデルとテクスチャを読み込んでいます…';
}
function updateStatus(){
  const error=canvas.dataset.error;
  status.classList.toggle('error',Boolean(error));
  if(error){
    status.textContent=`表示できませんでした。WebGPU対応のChromeで開いてください。詳細: ${error}`;
    rebuild.disabled=true;
  }else if(canvas.dataset.frames){
    status.textContent=canvas.dataset.selected==='true'?'選択中 · 回転停止':'表示中 · キャンバスをクリックして操作';
  }
}
new MutationObserver(updateStatus).observe(canvas,{attributes:true,attributeFilter:['data-error','data-selected','data-rebuilds']});
try{
  if(!navigator.gpu)throw new Error('このブラウザーではWebGPUを利用できません。');
  const {default:init,BrowserApp}=await import('./pkg/three_rs_wasm.js');
  await init();
  if(params.has('fixture')) {canvas.width=256;canvas.height=256;canvas.style.width='256px';canvas.style.height='256px';canvas.parentElement.style.borderRadius='0';}
  window.app=await BrowserApp.create(canvas,example,!staticMode);
  rebuild.disabled=false;
  status.textContent=example>=3?'表示中 · ドラッグで視点を変更':'表示中 · キャンバスをクリックして操作';
  if(example>=4){
    const controls=document.querySelector('#gltf-controls');
    const apply=()=>{const value=id=>Number(document.querySelector(id).value);const enabled=document.querySelector('#gltf-environment').value==='royal';window.app.gltf_controls(value('#gltf-exposure'),enabled?value('#gltf-intensity'):0,value('#gltf-rotation'),value('#gltf-blur'),enabled&&document.querySelector('#gltf-background').checked);};
    controls.addEventListener('input',apply);
    document.querySelector('#gltf-model').addEventListener('change',async event=>{
      const model=Number(event.target.value);
      status.textContent='モデルを読み込んでいます…';
      try{if(await window.app.load_model(model)) {showGltfModel(model);apply();delete canvas.dataset.error;status.textContent='表示中 · ドラッグで視点を変更';}}
      catch(error){status.textContent=`モデルの読み込みに失敗しました: ${error}`;}
    });
    if(!params.has('fixture'))new ResizeObserver(([entry])=>{const size=Math.max(1,Math.round(entry.contentRect.width));canvas.width=size;canvas.height=size;}).observe(canvas);
  }
  if(example===3){
    let paused=staticMode;
    const pause=document.querySelector('#pause');
    const amount=document.querySelector('#deformation');
    const speed=document.querySelector('#speed');
    const controls=()=>{
      pause.textContent=paused?'再生':'一時停止';pause.setAttribute('aria-pressed',String(paused));
      document.querySelector('#deformation-value').textContent=Number(amount.value).toFixed(1);
      document.querySelector('#speed-value').textContent=Number(speed.value).toFixed(1);
      window.app.point_lights_controls(paused,Number(amount.value),Number(speed.value));
    };
    pause.addEventListener('click',()=>{paused=!paused;controls();});
    amount.addEventListener('input',controls);speed.addEventListener('input',controls);controls();
  }
  if(example>=3){
    let drag=null;
    canvas.addEventListener('pointerdown',event=>{drag={x:event.clientX,y:event.clientY};canvas.setPointerCapture(event.pointerId);});
    canvas.addEventListener('pointermove',event=>{
      if(!drag)return;
      window.app.orbit(event.clientX-drag.x,event.clientY-drag.y,0);
      drag={x:event.clientX,y:event.clientY};
    });
    canvas.addEventListener('pointerup',()=>{drag=null;});
    canvas.addEventListener('pointercancel',()=>{drag=null;});
    canvas.addEventListener('lostpointercapture',()=>{drag=null;});
    canvas.addEventListener('wheel',event=>{event.preventDefault();window.app.orbit(0,0,event.deltaY);},{passive:false});
  }
  rebuild.addEventListener('click',()=>{
    try{window.app.rebuild();}catch(error){canvas.setAttribute('data-error',String(error));}
  });
}catch(error){canvas.setAttribute('data-error',String(error));}
</script>
</html>
